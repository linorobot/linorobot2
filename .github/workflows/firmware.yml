name: firmware
on:
  push:
    # any branch: firmware breakage should surface before a PR exists
    paths: [ 'firmware/**', '.github/workflows/firmware.yml' ]
  pull_request:
    branches: [ jazzy ]
    paths: [ 'firmware/**', '.github/workflows/firmware.yml' ]
jobs:
  # Fast, dependency-free check: compiles the real motor driver + config
  # headers on the host and runs the boot/stall behavior scenarios.
  host-sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host simulation
        working-directory: firmware/host_sim
        run: |
          g++ -std=c++14 -Wall -Wextra -Werror -Istub -I../include sim_boot.cpp -o sim_boot
          ./sim_boot

  # Full Teensy 4.1 firmware build (micro-ROS lib is fetched and built by
  # PlatformIO, so the first run is slow; the pio cache keeps reruns fast).
  pio-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Deliberately NOT ~/.platformio/penv: caching the venv can pin a
          # stale Python interpreter after a runner image update.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      # micro_ros_platformio's library builder sources
      # ~/.platformio/penv/bin/activate (the venv the official PlatformIO
      # installer creates). A plain `pip install platformio` doesn't create
      # it and the micro-ROS build fails, so install into that exact layout.
      - name: Install PlatformIO
        run: |
          python3 -m venv "$HOME/.platformio/penv"
          "$HOME/.platformio/penv/bin/pip" install platformio
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Build firmware
        working-directory: firmware
        run: pio run -e teensy41
