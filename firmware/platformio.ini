; linorobot2 base firmware for Teensy 4.1
;   2x CubeMars AK10-9 (MIT mode over CAN2) + optional MPU6050 IMU + micro-ROS.
;
; This is the firmware that makes the Teensy a micro-ROS node on the linorobot2
; network. The micro-ROS agent is launched on the robot computer by
;   ros2 launch linorobot2_bringup bringup.launch.py
;
; Build & flash:
;   pio run -e teensy41 -t upload
;
; FlexCAN_T4 is bundled with the Teensy platform, so it is not in lib_deps.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
; micro-ROS settings: distro MUST match the ROS 2 distro on the robot computer.
board_microros_distro = jazzy
board_microros_transport = serial
