/**:
  ros__parameters:
    filter1:
      name: battery_box
      type: laser_filters/LaserScanBoxFilter
      params:
        # Remove only the scan points that hit the BATTERY carried behind the
        # robot, instead of cropping the entire rear 180 deg like the old
        # angle_laser_filter.yaml did. This recovers most of the rear FOV for
        # scan matching (rf2o), SLAM loop closure, AMCL, and the costmaps.
        #
        # The box is axis-aligned in base_footprint (robot center, +x forward),
        # so it stays glued to the robot no matter how the lidar is mounted.
        # Extents are deliberately generous around the battery's resting spot;
        # shrink them once measured (see TESTING.md "Box laser filter").
        # NOTE: the robot cannot see real obstacles inside this box, so keep it
        # as small as the battery allows.
        box_frame: base_footprint
        min_x: -1.0   # 1.0 m behind robot center ...
        max_x: -0.10  # ... up to just behind the center (clear of the wheels)
        min_y: -0.5   # half a meter to either side
        max_y: 0.5
        min_z: -0.5
        max_z: 0.5
        invert: false  # remove points INSIDE the box, keep everything else
    filter2:
      name: mount_structure
      type: laser_filters/LaserScanBoxFilter
      params:
        # Mask the robot's OWN structure that the lidar sees ~0.22-0.26 m away
        # (a mount post / battery-box front face just behind center). The lidar
        # is mounted 0.185 m FORWARD of base_footprint and yawed 180 deg
        # (base_footprint->laser = translation [0.185,0,0], RPY [0,0,pi]), so the
        # raw scan return at laser-frame (x~0.223, y~-0.03) actually sits at
        # base_footprint (0.185 - x_laser, -y_laser) = ~(-0.04..-0.08, +0.03..+0.14).
        # Measured 2026-07-12 from live /scan: a stable ~50-point cluster whose
        # base_footprint extent is x[-0.079,-0.038], y[0.029,0.139] -- behind
        # center, slightly left, INSIDE the chassis footprint so it cannot be a
        # real obstacle. Left unmasked it fed collision_monitor a permanent
        # "collision" (action_type!=0 -> cmd_vel clamped to 0) and a phantom
        # local-costmap obstacle, so EVERY Nav2 goal stalled (robot couldn't even
        # rotate). battery_box (filter1) misses it because its front edge stops at
        # x=-0.10; this small box sits just in front of that, kept behind center
        # (max_x<=0) so it never blinds forward vision and preserves rear FOV.
        box_frame: base_footprint
        min_x: -0.14  # covers cluster back edge (-0.079) with margin; overlaps battery_box
        max_x: 0.00   # up to base center only -- never masks anything ahead
        min_y: -0.06  # small margin right of the cluster
        max_y: 0.22   # covers cluster left edge (0.139) with margin
        min_z: -0.5
        max_z: 0.5
        invert: false  # remove points INSIDE the box
    filter3:
      name: invalidate_cropped
      type: laser_filters/LaserScanRangeFilter
      params:
        # Belt-and-braces for downstream consumers that copy ranges without
        # validating them (rf2o): make sure anything out of the sensor's real
        # range limits is inf, which rf2o's isfinite check discards. (The box
        # filter itself writes NaN, which rf2o also discards.)
        use_message_range_limits: true
        lower_replacement_value: .inf
        upper_replacement_value: .inf
