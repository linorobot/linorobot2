amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # RPLIDAR A3 real range; 100.0 wasted the sensor model's dynamic range.
    laser_max_range: 25.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # 60 beams threw away 95% of the A3's ~1200 returns per scan. 120 beams
    # roughly halves pose jitter for a modest CPU cost.
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # Tighter measurement model (was 0.2) — justified once the map is
    # re-drawn at 0.025 m; pulls the pose estimate harder onto crisp walls.
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 0.5
    # Update thresholds tuned for the 0.05 m/s speed cap: with the stock
    # 0.25 m / 0.2 rad thresholds AMCL corrected map->odom only every ~5 s,
    # and each correction was a visible lurch the controller reacted to.
    # Smaller thresholds -> smaller, more frequent (per-second) corrections.
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Custom BT: the stock 0.30 m BackUp reversed blind (battery-box lidar
    # mask) into a wall. This tree uses a SHORT 0.15 m retreat instead -- only
    # re-entering space the robot just drove through -- then replans, which
    # straightens out doorway approaches. Recovery order: clear costmaps,
    # short retreat, wait, spin (spin last: riskiest next to doorframes).
    default_nav_to_pose_bt_xml: "/home/jetson1/Desktop/linorobot2/linorobot2_navigation/config/navigate_to_pose_doorway_recovery.xml"
    # 'default_nav_through_poses_bt_xml' uses the default:
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # 10 Hz: the Jetson CPU can't hold MPPI at 20 Hz (measured 10-12 Hz), and a
    # loop that misses its rate degrades trajectory tracking.
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # With the 0.05 m/s speed cap, 0.5 m / 10 s equalled the robot's maximum
      # speed, so any slowdown aborted the goal ("Failed to make progress").
      # 8 s: the robot needs only 2 s to cover 0.1 m at the cap, and a shorter
      # window means a stuck doorway approach reaches the backup recovery in
      # seconds instead of a minute. Don't go below ~6 s (tight in-place
      # maneuvers make slow but real progress).
      required_movement_radius: 0.1
      movement_time_allowance: 8.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35
    # RotationShim rotates in place toward the path heading first (safe with the
    # front-only lidar), then hands off to RegulatedPurePursuit -- the proven
    # controller from the jazzy branch. MPPI was tried here and never produced
    # forward motion on this hardware: at a 0.05 m/s cap its sampling optimizer
    # sat at vx=0 while the 10 Hz loop starved the Jetson (see git history).
    # Obstacle handling with RPP: the global planner replans around costmap
    # obstacles at 1 Hz, RPP's own collision detection brakes before impact
    # along the path, and the collision_monitor is the final stop layer.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.25
      max_angular_accel: 0.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      use_path_orientations: false

      # ---- RegulatedPurePursuit (primary controller) ----
      # SPEED CAP: keep autonomous linear speed at/below 0.05 m/s (drivetrain
      # protection). The velocity_smoother max_velocity below enforces the same
      # cap as the final gate before /cmd_vel -- change BOTH to go faster.
      desired_linear_vel: 0.05
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # Cost-regulated scaling OFF: with inflated cost covering much of the
      # apartment, it would scale the already-capped 0.05 m/s toward the
      # 0.025 floor everywhere. Curvature scaling stays on.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.025
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      # No reversing: the battery box directly behind the robot is masked out
      # of the scan (box_laser_filter.yaml), so reverse space cannot be checked.
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 550mm x 550mm square chassis, centered on base_footprint
      footprint: "[[0.275, 0.275], [0.275, -0.275], [-0.275, -0.275], [-0.275, 0.275]]"
      # Default padding is 0.05 (robot treated as 0.65 m wide). 0.01 makes the
      # effective width 0.57 m so ~0.6 m gaps (doorways) become plannable.
      # Real clearance in a 0.6 m gap is ~2.5 cm per side: only viable because
      # speed is capped at 0.05 m/s and the collision monitor guards contact.
      footprint_padding: 0.01
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.4 m = robot half-body (0.28 m inscribed) + ~0.1 m wall clearance,
        # so goals near walls stay plannable. Below ~0.35 the planner would
        # put the robot's body inside walls; do not reduce further.
        inflation_radius: 0.40
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # 2 Hz (was 1 Hz) so the BT's 1 Hz replan sees a newly detected obstacle
      # within ~0.5 s and reroutes around it sooner.
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # 550mm x 550mm square chassis, centered on base_footprint
      footprint: "[[0.275, 0.275], [0.275, -0.275], [-0.275, -0.275], [-0.275, 0.275]]"
      # Default padding is 0.05 (robot treated as 0.65 m wide). 0.01 makes the
      # effective width 0.57 m so ~0.6 m gaps (doorways) become plannable.
      # Real clearance in a 0.6 m gap is ~2.5 cm per side: only viable because
      # speed is capped at 0.05 m/s and the collision monitor guards contact.
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Matches the local costmap: half-body + ~0.1 m wall clearance.
        inflation_radius: 0.40
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # SPEED CAP: recovery spins/backups limited to match the 0.05 m/s regime.
    max_rotational_vel: 0.25
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # SPEED CAP: final gate before /cmd_vel. Nothing in autonomous mode can
    # exceed 0.05 m/s linear / 0.25 rad/s angular, whatever upstream commands.
    max_velocity: [0.05, 0.0, 0.25]
    min_velocity: [-0.05, 0.0, -0.25]
    # Ramp rates matched to teleop_keyboard.py's proven-smooth 0.05 m/s^2 slew
    # (autonomous previously decelerated at 0.5 m/s^2 -- 10x teleop). Stopping
    # from 0.05 m/s at 0.1 m/s^2 still takes only 0.5 s / 12.5 mm.
    max_accel: [0.05, 0.0, 0.25]
    max_decel: [-0.1, 0.0, -0.5]
    odom_topic: "odom"
    odom_duration: 0.1
    # Deadband disabled: at [0.01, 0, 0.05] it swallowed every accel-limited
    # ramp-up from standstill (MPPI's and RotationShim's first commands are
    # sub-deadband), so autonomous motion could never start. If idle stiction
    # twitching returns, fix the dither at its source (MPPI noise) instead.
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # time_before_collision projects the FULL 0.55 m footprint along the whole
      # twist for this long. At the 0.05 m/s cap 1.2 s was only 6 cm of forward
      # lookahead, but during RotationShim's in-place turn (0.25 rad/s) it swept
      # the footprint through 0.3 rad -- the 0.389 m circumscribed corners then
      # clipped any wall within ~0.44 m, so "approach" scaled the ENTIRE twist
      # (angular included) to zero and the robot could never even rotate to face
      # the path: every goal deadlocked. 0.5 s keeps a safe forward stop margin
      # (MPPI's CostCritic + 0.7 m inflation are the primary obstacle avoidance)
      # while shrinking the rotation sweep to ~7 deg. TUNE: if goals still stall
      # rotating in place near walls, drop to 0.3; if it clips obstacles going
      # forward, raise it.
      time_before_collision: 0.5
      simulation_time_step: 0.1
      min_points: 6
      # Visualize the polygon so the collision zone is visible in RViz (add a
      # Polygon display on /collision_monitor/polygons) while validating.
      visualize: True
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
